name: Build Android Release (Signed)

on:
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  android:
    name: Android Release (arm64 signed)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_STRIP: "symbols"
      CARGO_PROFILE_RELEASE_DEBUG: "false"
    steps:
      - uses: actions/checkout@v7

      - name: 读取并对齐版本号
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          node scripts/set-version.mjs "$V"
          CODE="$(node -p "require('./src-tauri/tauri.conf.json').bundle.android.versionCode")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$V  versionCode=$CODE"

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: android-release

      - run: pnpm install --frozen-lockfile

      - name: 生成 Android 工程
        run: pnpm tauri android init --ci

      - name: 编译正式版 APK（arm64）
        run: pnpm tauri android build --apk --split-per-abi --target aarch64

      - name: 对齐并签名 APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 ANDROID_KEY_BASE64 secret，请先在仓库 Settings 中配置"
            exit 1
          fi
          ALIAS="${KEY_ALIAS:-hghub}"
          S_PASS="${STORE_PASSWORD:-123456}"
          K_PASS="${KEY_PASSWORD:-123456}"

          KS="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "$KS"

          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/$BT/zipalign"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"

          mkdir -p artifacts
          found=0
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk'); do
            abi="$(basename "$(dirname "$(dirname "$f")")")"
            aligned="$RUNNER_TEMP/aligned_${abi}.apk"
            out="artifacts/HGhub_${VERSION}_${abi}_signed.apk"
            "$ZIPALIGN" -f -p 4 "$f" "$aligned"
            "$APKSIGNER" sign \
              --ks "$KS" --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$S_PASS" --key-pass "pass:$K_PASS" \
              --v4-signing-enabled false \
              --out "$out" "$aligned"
            "$APKSIGNER" verify --print-certs "$out" | head -3
            found=$((found+1))
          done
          rm -f "$KS"
          if [ "$found" -eq 0 ]; then
            echo "::error::没有找到 release APK"
            exit 1
          fi
          ls -lh artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: android-release-signed
          path: artifacts/*
          if-no-files-found: error
