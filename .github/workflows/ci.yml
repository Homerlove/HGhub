name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Resolve browser and media tools
        run: |
          set -euo pipefail
          browser="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          if [ -z "$browser" ]; then
            echo "System Chromium not found; installing Playwright Chromium from cache"
            pnpm exec playwright-core install chromium
            browser="$(node -e 'const { chromium } = require("playwright-core"); console.log(chromium.executablePath())')"
          fi
          ffmpeg="$(command -v ffmpeg || true)"
          if [ -z "$ffmpeg" ]; then
            echo "System ffmpeg not found; installing"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
            ffmpeg="$(command -v ffmpeg)"
          fi
          echo "BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"
          echo "FFMPEG_PATH=$ffmpeg" >> "$GITHUB_ENV"
          "$browser" --version
          "$ffmpeg" -version | head -1

      - name: Typecheck and build
        run: pnpm build

      - name: Channel pagination regression
        run: |
          if node -e "process.exit(require('./package.json').scripts['test:channel-pagination'] ? 0 : 1)"; then
            pnpm test:channel-pagination
          else
            echo "test:channel-pagination not present on this branch yet; skipped until PR #48 lands"
          fi

      - name: API loading states
        run: pnpm test:api-loading

      - name: Mobile layout
        run: pnpm test:mobile-layout

      - name: Diagnostic copy
        run: pnpm test:diagnostic-copy

      - name: Playback diagnostics
        run: pnpm test:playback -- --browser-executable "$BROWSER_EXECUTABLE"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: warn

  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-v1
          restore-keys: apt-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo mkdir -p "$RUNNER_TEMP/apt-archives"
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/apt-archives/" install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri -> target
          key: ci-rust

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Cargo unit tests
        working-directory: src-tauri
        run: cargo test --lib
