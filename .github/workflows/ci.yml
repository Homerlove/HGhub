name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser and media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pnpm exec playwright-core install --with-deps chromium

      - name: Typecheck and build
        run: pnpm build

      - name: Channel pagination regression
        run: |
          if node -e "process.exit(require('./package.json').scripts['test:channel-pagination'] ? 0 : 1)"; then
            pnpm test:channel-pagination
          else
            echo "test:channel-pagination not present on this branch yet; skipped until PR #48 lands"
          fi

      - name: API loading states
        run: pnpm test:api-loading

      - name: Mobile layout
        run: pnpm test:mobile-layout

      - name: Diagnostic copy
        run: pnpm test:diagnostic-copy

      - name: Playback diagnostics
        run: pnpm test:playback

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
