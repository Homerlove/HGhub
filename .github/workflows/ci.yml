name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: CI image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image tag
        id: meta
        run: |
          tag=$(sha256sum ci/Dockerfile | cut -c1-12)
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/hghub-ci:${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether image exists
        id: exists
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.image }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/Dockerfile
          push: true
          platforms: linux/amd64
          network: host
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: Frontend checks
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck and build
        run: pnpm build

      - name: Channel pagination regression
        run: |
          if node -e "process.exit(require('./package.json').scripts['test:channel-pagination'] ? 0 : 1)"; then
            pnpm test:channel-pagination
          else
            echo "test:channel-pagination not present on this branch yet; skipped until PR #48 lands"
          fi

      - name: Brand neutrality
        run: |
          if node -e "process.exit(require('./package.json').scripts['test:brand-neutral'] ? 0 : 1)"; then
            pnpm test:brand-neutral
          else
            echo "test:brand-neutral not present on this branch yet; skipped until PR #53 lands"
          fi

      - name: API loading states
        run: pnpm test:api-loading

      - name: Mobile layout
        run: pnpm test:mobile-layout

      - name: Diagnostic copy
        run: pnpm test:diagnostic-copy

      - name: Playback diagnostics
        run: pnpm test:playback

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: warn

  rust:
    name: Rust checks
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri -> target
          key: ci-rust

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Cargo unit tests
        working-directory: src-tauri
        run: cargo test --lib
