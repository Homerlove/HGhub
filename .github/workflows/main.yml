name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configure Android NDK
        run: |
          NDK_DIR=$(ls -d "$ANDROID_HOME/ndk/"* | sort -V | tail -n 1)
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Install dependencies
        run: pnpm install

      - name: Init Android project
        run: pnpm android:init || pnpm tauri android init

      - name: Build Debug APK
        run: pnpm tauri android build --debug --apk --target aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
